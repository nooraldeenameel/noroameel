<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>تحميل من رابط</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <main class="container">
    <h1>تحميل ملف عبر رابط</h1>
    <p>ألصق رابط الملف وسيتم تنزيله مباشرة.</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <ul class="messages">
          {% for category, message in messages %}
            <li class="message {{ category }}">{{ message }}</li>
          {% endfor %}
        </ul>
      {% endif %}
    {% endwith %}

    <form action="{{ url_for('download_from_url') }}" method="post" class="download-form">
      <label for="url">رابط الملف</label>
      <input id="url" name="url" type="url" placeholder="https://example.com/file.zip" required>
      <button type="submit">تحميل</button>
    </form>
  </main>
</body>
</html>
